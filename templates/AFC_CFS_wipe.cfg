# Nozzle wipes on the K1 napkin strip (the pad on the back edge of the build plate)
#
# Copy into your AFC config folder next to AFC_CFS_1.cfg. Two macros:
#
#   _SAF_NOZZLE_WIPE    Simple AF's start-of-print load cell wipe, moved onto the pad.
#                       Simple AF's own version picks a random 30 mm line anywhere in
#                       the middle third of X, which on a K1 with the CFS kit runs past
#                       the pad into the purge hopper. This one always wipes inside the
#                       pad, approaches and leaves from the front, and reuses Simple
#                       AF's tapping helpers. Needs [include loadcells_wipe.cfg] in
#                       printer.cfg (for the helpers), and this file included after it
#                       ([include AFC/*.cfg] at the end of printer.cfg is).
#                       It also records the pad height for the wipe below.
#
#   AFC_CFS_PAD_WIPE    Quick wipe after each purge: set wipe: True and
#                       wipe_cmd: AFC_CFS_PAD_WIPE in AFC.cfg. Drags the nozzle across
#                       the pad at the height measured by the start wipe, no tapping.
#                       Skipped (with a message) if no start wipe ran since Klipper
#                       started.
#
# Both stay inside x_left..x_right at Y y, where the toolhead can't reach the hopper,
# and only move sideways in front of safe_y (the cutter pin is at X42 behind it).

[gcode_macro _AFC_CFS_PAD_VARS]
# Measured on a K1: the pad runs X60 to X96; its front edge is at Y223 and the
# nozzle is over the middle of it at Y226. Keep a few mm inside its ends.
variable_x_left: 64
variable_x_right: 92
variable_y: 226
# In front of the hopper and the cutter pin; sideways moves only happen here
variable_safe_y: 215
# Quick wipe: passes across the pad, speed, and height above the measured pad
variable_wipe_passes: 3
variable_wipe_speed: 50            # mm/s
variable_wipe_height: 0.1          # mm above the pad; raise if it drags too hard
# Set by the start wipe; -999 = not measured since Klipper started
variable_pad_z: -999.0
gcode:

[gcode_macro _SAF_NOZZLE_WIPE]
description: Load cell nozzle wipe on the back pad (CFS-safe version of Simple AF's)
gcode:
    {% set pad = printer["gcode_macro _AFC_CFS_PAD_VARS"] %}
    {% set lc = printer.configfile.settings.load_cell_probe %}
    {% set lc_probe = lc.register_as_probe|default(True) %}
    {% set home_taps = lc_probe and 'probe:z_virtual_endstop' not in printer.configfile.settings.stepper_z.endstop_pin %}
    {% set single = not lc_probe and lc.sensor_type == 'hx711' %}
    {% set tap_status = printer.probe if lc_probe else printer.load_cell_probe %}
    {% if printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"] is not defined %}
      RESPOND TYPE=error MSG="Pad wipe skipped: [include loadcells_wipe.cfg] is missing from printer.cfg"
    {% elif tap_status.last_z_result is not defined %}
      RESPOND TYPE=error MSG="Pad wipe skipped, Kalico is out of date, update Kalico to use the load cell wipe"
    {% else %}
      {% set min_x = printer.configfile.settings.stepper_x.position_min %}
      {% set max_x = printer.configfile.settings.stepper_x.position_max %}
      {% set min_y = printer.configfile.settings.stepper_y.position_min %}
      {% set max_y = printer.configfile.settings.stepper_y.position_max %}
      {% set zero = printer.configfile.settings.bed_mesh.zero_reference_position|default([(min_x + max_x) / 2, (min_y + max_y) / 2]) %}
      {% set temp = [params.EXTRUDER_TEMP|default(210)|float, 180]|max %}
      {% set bed = params.BED_TEMP|default(60)|float %}
      {% set bed_max = 150 %}
      {% set hot_min = [temp - 90, bed_max]|min %}
      # wipe right to left: start at x_right, finish at x_left
      {% set sx = pad.x_right|float %}
      {% set ex = pad.x_left|float %}
      {% set y = pad.y|float %}

      RESPOND TYPE=command MSG="Wiping nozzle on the pad"
      M140 S{bed}
      M104 S{hot_min}
      {% if printer.toolhead.homed_axes != "xyz" %}
        G28
      {% endif %}
      BED_MESH_CLEAR
      G90
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_min - 10} MAXIMUM={hot_min + 10}
      {% if home_taps %}
        G1 X{zero[0]} Y{zero[1]} Z5 F12000
      {% endif %}
      {% if bed > 0 %}
        RESPOND TYPE=command MSG="Pad wipe: waiting for bed {bed}"
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 5} MAXIMUM={bed + 5}
      {% endif %}
      {% if home_taps %}
        M400
        G4 P5000
        PROBE SAMPLES=1 HOME=Z
        G1 Z5 F300
        M400
        G4 P5000
        PROBE SAMPLES=1 HOME=Z
        G1 Z5 F300
      {% endif %}
      M104 S{[hot_min + 40, bed_max]|min}

      # bed down, across in front of the hopper, then straight back onto the pad
      {% if printer.toolhead.position.z < 10 %}
        G1 Z10 F600
      {% endif %}
      {% if printer.toolhead.position.y > pad.safe_y %}
        G1 Y{pad.safe_y} F12000
      {% endif %}
      G1 X{sx} Y{pad.safe_y} F12000
      G1 Y{y} F6000
      G1 Z5 F600
      _LOAD_CELL_WIPE_MEASURE POINT=src_z NAME=start
      {% if not single %}
        G1 X{ex} Y{y} Z5 F6000
      {% endif %}
      M106 S0
      {% if not single %}
        _LOAD_CELL_WIPE_MEASURE POINT=end_z NAME=end
      {% endif %}
      _AFC_CFS_PAD_WIPE_RUN SX={sx} EX={ex} Y={y} HOT_MIN={hot_min} HOT_MAX={[temp - 50, bed_max]|min} RESTORE={printer.extruder.target} MESH="{printer.bed_mesh.profile_name}" SINGLE={1 if single else 0}
    {% endif %}

[gcode_macro _AFC_CFS_PAD_WIPE_RUN]
gcode:
    {% set pad = printer["gcode_macro _AFC_CFS_PAD_VARS"] %}
    {% set state = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"] %}
    {% set sx = params.SX|float %}
    {% set ex = params.EX|float %}
    {% set y = params.Y|float %}
    {% set hot_min = params.HOT_MIN|float %}
    {% set hot_max = params.HOT_MAX|float %}
    {% set end_z = state.src_z if params.SINGLE|default(0)|int else state.end_z %}
    SET_GCODE_VARIABLE MACRO=_AFC_CFS_PAD_VARS VARIABLE=pad_z VALUE={(state.src_z + end_z) / 2}

    RESPOND TYPE=command MSG="Pad wipe: lowering to {(state.src_z + 0.15)|round(3)}"
    G1 X{sx} Y{y} Z5 F6000
    G1 Z{state.src_z + 0.15} F300
    M104 S{hot_max}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_max - 10} MAXIMUM={hot_max + 10}

    RESPOND TYPE=command MSG="Pad wipe: wiping to {(end_z - 0.15)|round(3)}"
    G1 X{ex} Y{y} Z{end_z - 0.15} F120
    M106 S255
    M104 S{hot_min}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_min - 5} MAXIMUM={hot_min + 5}

    # lift off pulling forward, not sideways: past the right end is the hopper,
    # past the left end is the cutter pin
    RESPOND TYPE=command MSG="Pad wipe: lifting off"
    G1 Y{y - 4} Z{end_z + 10} F120
    G1 Y{pad.safe_y} F6000
    M106 S0
    {% if params.MESH %}
      BED_MESH_PROFILE LOAD="{params.MESH}"
    {% endif %}
    M109 S{params.RESTORE|float}
    RESPOND TYPE=command MSG="Pad wipe: done, pad height {((state.src_z + end_z) / 2)|round(3)}"

[gcode_macro AFC_CFS_PAD_WIPE]
description: Quick nozzle wipe on the back pad after a purge (AFC wipe_cmd)
gcode:
    {% set v = printer["gcode_macro _AFC_CFS_PAD_VARS"] %}
    {% set pos = printer.toolhead.position %}
    {% if v.pad_z|float < -100 %}
      RESPOND MSG="Pad wipe skipped: no pad height yet (it is measured by the start-of-print wipe)"
    {% elif printer.toolhead.homed_axes != "xyz" %}
      RESPOND MSG="Pad wipe skipped: not homed"
    {% else %}
      # Z in gcode coordinates: take back any gcode Z offset so the nozzle sits
      # wipe_height above the pad as it was measured
      {% set z_wipe = v.pad_z|float + v.wipe_height|float - printer.gcode_move.homing_origin.z %}
      {% set z_clear = z_wipe + 10 %}
      {% set f = v.wipe_speed|float * 60 %}
      SAVE_GCODE_STATE NAME=_afc_cfs_pad_wipe
      G90
      {% if pos.z < z_clear %}
        G1 Z{z_clear} F900
      {% endif %}
      {% if pos.y > v.safe_y %}
        G1 Y{v.safe_y} F12000
      {% endif %}
      G1 X{v.x_right} F12000
      G1 Y{v.y} F6000
      G1 Z{z_wipe} F600
      {% for i in range(v.wipe_passes|int) %}
        G1 X{v.x_left} F{f}
        G1 X{v.x_right} F{f}
      {% endfor %}
      G1 X{v.x_left} F{f}
      G1 Y{v.y - 4} Z{z_clear} F1200
      G1 Y{v.safe_y} F12000
      M400
      RESTORE_GCODE_STATE NAME=_afc_cfs_pad_wipe
    {% endif %}
